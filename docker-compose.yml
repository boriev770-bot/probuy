version: "3.8"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./:/app
    env_file:
      - .env
    depends_on:
      - db
    command: >
      bash -lc "pip install --no-cache-dir -r requirements.txt && python -m uvicorn api:app --host 0.0.0.0 --port 8000 & python -u bot.py"
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  db_data:

